apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: P8B9C0A7F6E5D4C3
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
